<!DOCTYPE html>
<html>
<head>
    <title>Jarvis Login</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #1a1a1a; padding: 40px; border-radius: 10px; text-align: center; }
        input { padding: 10px; width: 200px; margin: 10px; background: #333; color: white; border: none; border-radius: 5px; }
        button { padding: 10px 20px; background: #00ff88; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        a { color: #00ff88; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🤖 JARVIS</h1>
        <p>Login to continue</p>
        <form action="/login" method="POST">
            <input name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p>Don't have account? <a href="/signup">Sign up</a></p>
    </div>
</body>
</html>
