<!DOCTYPE html>
<html>
<head>
    <title>Jarvis Login</title>
    <style>
        body{background:#0a0a0a;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
        .box{background:#1a1a1a;padding:40px;border-radius:15px;width:300px;text-align:center}
        input{width:90%;padding:10px;margin:10px 0;border:none;border-radius:5px;background:#2a2a2a;color:white}
        button{width:95%;padding:10px;background:#00ff88;color:black;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
        button:hover{background:#00cc70}
        a{color:#00ff88;text-decoration:none}
    </style>
</head>
<body>
    <div class="box">
        <h1>🤖 JARVIS</h1>
        <p>Login to continue</p>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <br>
        <a href="/signup">Don't have account? Sign up</a>
    </div>
</body>
</html>
