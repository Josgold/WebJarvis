<!DOCTYPE html>
<html>
<body style="background:#0a0a0a;color:white;font-family:Arial;padding:20px">
<h1>Welcome {{ user }} 👑</h1>
<a href="/logout" style="color:red">Logout</a>
<hr>
<h2>Talk to JARVIS</h2>
<form method="POST">
<input name="prompt" placeholder="Ask Jarvis anything..." style="width:70%;padding:10px">
<button style="padding:10px;background:#00ff88;border:none">Send</button>
</form>
<br>
<div style="background:#1a1a1a;padding:20px;border-radius:10px">
<h3>JARVIS:</h3>
<p>{{ response }}</p>
</div>
</body>
</html>
